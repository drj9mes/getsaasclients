name: Import GetSaaSClients source

on: workflow_dispatch

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source archive
        run: |
          set -euo pipefail

          test -f GetSaaSClients_source_current.zip
          unzip -t GetSaaSClients_source_current.zip

          ARCHIVE_LIST="$(unzip -Z1 GetSaaSClients_source_current.zip)"

          if printf '%s\n' "$ARCHIVE_LIST" | grep -Eq '(^|/)\.git(/|$)|(^|/)node_modules(/|$)'; then
            echo "Archive contains forbidden .git or node_modules paths."
            exit 2
          fi

          if printf '%s\n' "$ARCHIVE_LIST" | grep -Eq '(^|/)\.env$|(^|/)\.env\.(local|production|development|test)$'; then
            echo "Archive contains a real environment/secrets file."
            exit 2
          fi

          echo "Archive verification passed."

      - name: Extract complete project
        run: |
          set -euo pipefail

          unzip -oq GetSaaSClients_source_current.zip -d .

          rm -f GetSaaSClients_source_current.zip
          rm -f .github/workflows/blank.yml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate production lockfile
        run: |
          set -euo pipefail
          pnpm install --lockfile-only

      - name: Run dependency-independent release checks
        run: |
          set -euo pipefail
          pnpm test:offline

      - name: Commit complete application
        run: |
          set -euo pipefail

          git config user.name "getsaasclients-ci"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi

          git commit -m "build: import complete GetSaaSClients application"
          git push
